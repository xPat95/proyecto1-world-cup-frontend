<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup Sticker Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <img class="app-logo" src="./assets/logo.png" alt="Logo del Mundial">
      <div>
        <h1>World Cup Sticker Tracker</h1>
        <p>Controla tus estampillas faltantes, conseguidas y repetidas.</p>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <section class="stats-section" aria-label="Estadisticas de la coleccion">
      <article class="stat-card">
        <span class="stat-label">Total</span>
        <strong class="stat-value">0</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">Conseguidas</span>
        <strong class="stat-value">0</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">Faltantes</span>
        <strong class="stat-value">0</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">Repetidas</span>
        <strong class="stat-value">0</strong>
      </article>
      <article class="stat-card progress-card">
        <span class="stat-label">Progreso</span>
        <strong class="stat-value">0%</strong>
      </article>
    </section>

    <section class="controls-section" aria-label="Controles de busqueda y filtrado">
      <label class="control-group" for="search-input">
        <span>Buscar</span>
        <input id="search-input" type="search" placeholder="Jugador, pais o numero">
      </label>

      <label class="control-group" for="status-filter">
        <span>Estado</span>
        <select id="status-filter">
          <option value="">Todos</option>
          <option value="missing">Faltantes</option>
          <option value="owned">Conseguidas</option>
          <option value="duplicate">Repetidas</option>
        </select>
      </label>

      <label class="control-group" for="sort-field">
        <span>Ordenar por</span>
        <select id="sort-field">
          <option value="sticker_number">Numero</option>
          <option value="player_name">Jugador</option>
          <option value="country">Pais</option>
          <option value="quantity">Cantidad</option>
        </select>
      </label>

      <label class="control-group" for="sort-order">
        <span>Orden</span>
        <select id="sort-order">
          <option value="asc">Ascendente</option>
          <option value="desc">Descendente</option>
        </select>
      </label>
    </section>

    <section class="content-layout">
      <section class="stickers-panel" aria-label="Listado de estampillas">
        <div class="section-heading">
          <h2>Estampillas</h2>
          <span class="section-note">Vista previa</span>
        </div>

        <div class="stickers-grid" id="stickers-grid">
          <p class="empty-message">Las estampillas se cargaran despues desde la API.</p>
        </div>
      </section>

      <section class="form-panel" aria-label="Formulario de estampilla">
        <h2>Registrar estampilla</h2>
        <form class="sticker-form" id="sticker-form">
          <label for="sticker-number">
            Numero de estampilla
            <input id="sticker-number" name="sticker_number" type="text" placeholder="ARG-10">
          </label>

          <label for="player-name">
            Nombre del jugador
            <input id="player-name" name="player_name" type="text" placeholder="Lionel Messi">
          </label>

          <label for="country">
            Pais o seleccion
            <input id="country" name="country" type="text" placeholder="Argentina">
          </label>

          <label for="position">
            Posicion
            <input id="position" name="position" type="text" placeholder="Delantero">
          </label>

          <label for="quantity">
            Cantidad
            <input id="quantity" name="quantity" type="number" min="0" placeholder="0">
          </label>

          <label for="notes">
            Notas
            <textarea id="notes" name="notes" rows="4" placeholder="Notas de intercambio o estado"></textarea>
          </label>

          <div class="form-actions">
            <button type="submit" class="button primary-button">Guardar</button>
            <button type="reset" class="button secondary-button">Limpiar</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <footer class="app-footer">
    <p>Proyecto 1 - Tecnologias Web: Full Stack</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
